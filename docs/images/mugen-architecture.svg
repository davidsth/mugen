<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.browser{fill:#e0f2fe;stroke:#0369a1;stroke-width:3;rx:22}.app{fill:#fef3c7;stroke:#b45309;stroke-width:2;rx:18}.title{font:700 24px system-ui,sans-serif;fill:#0f172a}.label{font:600 19px system-ui,sans-serif;fill:#0f172a}.small{font:16px system-ui,sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="1200" height="720" fill="#fff"/><text x="600" y="48" text-anchor="middle" class="title" font-size="32">Mugen: Browser + Independent App Servers</text><rect x="50" y="85" width="690" height="575" class="browser"/><text x="395" y="125" text-anchor="middle" class="title">Mugen Browser · Rust</text><rect x="85" y="155" width="620" height="100" class="box"/><text x="395" y="194" text-anchor="middle" class="label">App discovery · lifecycle · permissions · storage</text><text x="395" y="225" text-anchor="middle" class="small">Browser-owned services</text><rect x="85" y="285" width="295" height="130" class="box"/><text x="232" y="330" text-anchor="middle" class="label">Native renderer</text><text x="232" y="360" text-anchor="middle" class="small">Layout · drawing · input</text><text x="232" y="388" text-anchor="middle" class="small">Focus and keyboard</text><rect x="410" y="285" width="295" height="130" class="box"/><text x="557" y="330" text-anchor="middle" class="label">Accessibility</text><text x="557" y="360" text-anchor="middle" class="small">Semantic UI tree</text><text x="557" y="388" text-anchor="middle" class="small">AccessKit → OS APIs</text><rect x="85" y="445" width="620" height="170" class="box"/><text x="395" y="485" text-anchor="middle" class="label">Typed protocol client</text><text x="395" y="520" text-anchor="middle" class="small">Snapshots · versioned patches · typed events</text><text x="395" y="550" text-anchor="middle" class="small">Validation · transport · app session</text><text x="395" y="585" text-anchor="middle" class="small">No web runtime and no app code in browser process</text><rect x="805" y="140" width="345" height="210" class="app"/><text x="977" y="180" text-anchor="middle" class="title">Crystal App A</text><text x="977" y="220" text-anchor="middle" class="label">Routes · UI tree · state</text><text x="977" y="255" text-anchor="middle" class="small">Data · business logic</text><text x="977" y="285" text-anchor="middle" class="small">Independent process</text><rect x="805" y="410" width="345" height="210" class="app"/><text x="977" y="450" text-anchor="middle" class="title">Crystal App B</text><text x="977" y="490" text-anchor="middle" class="label">Routes · UI tree · state</text><text x="977" y="525" text-anchor="middle" class="small">Data · business logic</text><text x="977" y="555" text-anchor="middle" class="small">Independent process</text><path d="M740 515 L795 245" class="arrow"/><path d="M740 535 L795 515" class="arrow"/><text x="770" y="370" class="small" transform="rotate(-78 770 370)">Typed protocol</text><text x="600" y="690" text-anchor="middle" class="small">Browser owns presentation and access; apps own application behavior.</text></svg>