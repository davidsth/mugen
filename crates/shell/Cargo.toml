[package]
name = "mugen-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mugen shell: window, joined-app list, lifecycle, local app adding."

[[bin]]
name = "mugen"
path = "src/main.rs"

[dependencies]
mugen-protocol = { path = "../protocol" }
winit = "0.30"
softbuffer = "0.4"

